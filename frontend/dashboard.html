<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Notes Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #bfa1a1, #d7c1c1);
        }


        .container {
            width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }


        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }


        #noteForm {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }


        #title {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        #content {
            height: 150px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: none;
            font-size: 14px;
        }

        #file {
            font-size: 13px;
        }

        button {
            padding: 10px;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.3s;
        }

        button:hover {
            background: #c92c3b;
        }


        #notes {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .note {
            background: #f9f9f9;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }


        .note h3 {
            margin-bottom: 6px;
            color: #222;
        }

        .note p {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }

        .note img {
            width: 100px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .note a {
            display: inline-block;
            margin-bottom: 8px;
            color: #1d3557;
            text-decoration: none;
        }

        .note a:hover {
            text-decoration: underline;
        }

        .note button {
            background: #ff4d4d;
            font-size: 13px;
            padding: 6px 10px;
            position: relative;
            left: 250px;
            bottom: 50px;
        }

        .note button:hover {
            background: #e63939;
        }


        #notes::-webkit-scrollbar {
            width: 6px;
        }

        #notes::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>My Notes</h2>

        <form id="noteForm">
            <input type="text" id="title" name="title" placeholder="Title" required />
            <textarea id="content" name="content" placeholder="Content"></textarea>
            <input type="file" id="file" name="file" />
            <button>Add Note</button>
        </form>



        <div id="notes"></div>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
